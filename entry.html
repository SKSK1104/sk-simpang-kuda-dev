        function getStudentReligion(name) {
            const cleanName = (name || "").trim().toUpperCase();
            return ISLAM_STUDENTS.includes(cleanName) ? "ISLAM" : "MORAL";
        }

        async function checkAuthSession() {
            const { data: { session } } = await db.auth.getSession();
            const modal = document.getElementById('auth-modal');
            if (session) {
                modal.classList.add('hidden');
                renderStudentList();
            } else {
                modal.classList.remove('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const rawId = document.getElementById('auth-id').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-submit-btn');
            const errDiv = document.getElementById('auth-error');

            const email = rawId.includes('@') ? rawId : `${rawId}@simpangkuda.com`;

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memeriksa...`;
            lucide.createIcons();
            errDiv.classList.add('hidden');

            const { data, error } = await db.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.innerHTML = `<span>Log Masuk</span><i data-lucide="log-in" class="w-4 h-4"></i>`;
            lucide.createIcons();

            if (error) {
                errDiv.textContent = "Log masuk gagal: ID atau Kata Laluan tidak sah.";
                errDiv.classList.remove('hidden');
            } else {
                document.getElementById('auth-modal').classList.add('hidden');
                renderStudentList();
            }
        }

        async function handleLogout() {

        function getStudentNames(className) {
            if (typeof SCHOOL_ROSTER !== 'undefined') {
                if (SCHOOL_ROSTER[className]) return SCHOOL_ROSTER[className];
                for (let yr in SCHOOL_ROSTER) {
                    if (SCHOOL_ROSTER[yr][className]) return SCHOOL_ROSTER[yr][className];
                }
            }
            return BACKUP_ROSTER[className] || [];
        }

        function calculateGrade(score) {
            if (score === null || score === undefined || score === '' || isNaN(score)) {
                return { grade: 'TH', desc: 'Tidak Hadir', color: 'text-gray-400 bg-gray-800' };
            }
            const s = Number(score);
            if (s >= 80) return { grade: 'A', desc: 'Cemerlang', color: 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' };
            if (s >= 65) return { grade: 'B', desc: 'Kepujian', color: 'text-blue-400 bg-blue-500/10 border-blue-500/20' };
            if (s >= 50) return { grade: 'C', desc: 'Baik', color: 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20' };
            if (s >= 40) return { grade: 'D', desc: 'Memuaskan', color: 'text-amber-400 bg-amber-500/10 border-amber-500/20' };
            return { grade: 'E', desc: 'Belum Capai', color: 'text-red-400 bg-red-500/10 border-red-500/20' };
        }

        async function renderStudentList() {
            const className = document.getElementById('class-select').value;
            const subjectName = document.getElementById('subject-select').value;
            const examType = document.getElementById('exam-select').value;
            const tableBody = document.getElementById('student-table-body');

            const studentNames = getStudentNames(className);

            let existingMarks = [];
            try {
                const { data, error } = await db
                    .from('student_marks')
                    .select('*')
                    .eq('class_name', className)
                    .eq('subject_name', subjectName)
                    .eq('exam_type', examType);
                if (!error && data) existingMarks = data;
            } catch (err) {
                console.warn("Supabase fetch error", err);
            }

            tableBody.innerHTML = '';

            studentNames.forEach((name, idx) => {
                const studentId = idx + 1;
                const religion = getStudentReligion(name);
                const match = existingMarks.find(m => m.student_name === name || Number(m.student_id) === studentId);
                const score = match && match.score_val !== null ? match.score_val : '';
                const gradeInfo = calculateGrade(score);

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800/20 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center text-gray-400 text-xs">${studentId}</td>
                    <td class="py-3 px-4 font-medium text-gray-200">${name}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="text-xs px-2 py-0.5 rounded ${religion === 'ISLAM' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-gray-800 text-gray-400'}">
                            ${religion}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <input type="number" min="0" max="100" 
                               value="${score}"
                               placeholder="TH"
                               data-student-id="${studentId}"
                               data-student-name="${name}"
                               data-religion="${religion}"
                               class="mark-input w-24 bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1 text-center font-bold text-white focus:outline-none focus:border-indigo-500 transition-all text-sm">
                    </td>
                    <td class="py-3 px-4 text-center">
                        <span class="grade-badge inline-block w-8 py-0.5 rounded border text-xs font-bold ${gradeInfo.color}">
                            ${gradeInfo.grade}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center text-xs desc-text text-gray-400">
                        ${gradeInfo.desc}
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            bindInputEvents();
            updateLiveStats();
        }

        function bindInputEvents() {
            document.querySelectorAll('.mark-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    const row = e.target.closest('tr');
                    const gradeBadge = row.querySelector('.grade-badge');
                    const descText = row.querySelector('.desc-text');

                    const gradeInfo = calculateGrade(val);
                    gradeBadge.textContent = gradeInfo.grade;
                    gradeBadge.className = `grade-badge inline-block w-8 py-0.5 rounded border text-xs font-bold ${gradeInfo.color}`;
                    descText.textContent = gradeInfo.desc;

                    updateLiveStats();
                });
            });
        }

        function updateLiveStats() {
            const inputs = document.querySelectorAll('.mark-input');
            let pass = 0, fail = 0;

            inputs.forEach(inp => {
                const val = inp.value;
                if (val !== '' && !isNaN(val)) {
                    const s = Number(val);
                    if (s >= 40) pass++;
                    else fail++;
                }
            });

            document.getElementById('total-count').textContent = inputs.length;
            document.getElementById('pass-count').textContent = pass;
            document.getElementById('fail-count').textContent = fail;
        }

        async function saveMarks() {
            const className = document.getElementById('class-select').value;
            const subjectName = document.getElementById('subject-select').value;
            const examType = document.getElementById('exam-select').value;
            const saveBtn = document.getElementById('save-btn');
            const syncStatus = document.getElementById('sync-status');

            const inputs = document.querySelectorAll('.mark-input');
            if (inputs.length === 0) return;

            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...`;
            lucide.createIcons();

            const records = Array.from(inputs).map(inp => {
                const scoreVal = (inp.value === '' || isNaN(inp.value)) ? null : Number(inp.value);
                const grade = calculateGrade(scoreVal).grade;
                return {
                    school_year: '2026',
                    class_name: className,
                    subject_name: subjectName,
                    exam_type: examType,
                    student_id: parseInt(inp.dataset.studentId),
                    student_name: inp.dataset.studentName,
                    religion: inp.dataset.religion || 'MORAL',
                    score_val: scoreVal,
                    grade_val: grade,
                    updated_at: new Date().toISOString()
                };
            });

            const { data, error } = await db
                .from('student_marks')
                .upsert(records, { onConflict: 'class_name,subject_name,student_id,exam_type' });

            saveBtn.disabled = false;
            saveBtn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> Simpan Markah ke Cloud`;
            lucide.createIcons();

            if (error) {
                alert("Ralat semasa menyimpan: " + error.message);
                syncStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                syncStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> Gagal Disimpan`;
            } else {
                syncStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                syncStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Berjaya Disimpan`;
                alert(`Markah bagi ${className} (${subjectName}) telah berjaya disimpan ke Supabase!`);
            }
        }

        window.addEventListener('DOMContentLoaded', checkAuthSession);
    </script>
</body>
</html>
